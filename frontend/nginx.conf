# Serves the built PWA. /api is NOT proxied here — the k3s Ingress routes
# /api to the backend Service, so the browser sees one origin.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Client-side routing: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always revalidate the app shell, manifest and service worker,
    # so phones pick up new builds promptly
    location = /index.html            { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest  { add_header Cache-Control "no-cache"; }
    location ~ ^/(sw|service-worker)\.js$ { add_header Cache-Control "no-cache"; }

    # Vite emits content-hashed files under /assets — safe to cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
