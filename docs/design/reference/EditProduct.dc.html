<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onhand — Edit product</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E6B5E}a:hover{color:#0B5148}
.t-light{--bg:#F5F6F4;--surface:#FFFFFF;--ink:#15181C;--muted:#5B616B;--line:#E4E6E3;--line-soft:#EEF0ED;--accent:#0E6B5E;--on-accent:#FFFFFF;--accent-ink:#0E6B5E;--sel-bg:#15181C;--sel-ink:#FFFFFF;--note-bg:#E6F2EF;--note-ink:#0B5148;--low-ink:#8A4B08}
.t-dark{--bg:#0F1113;--surface:#181B1F;--ink:#ECEEEF;--muted:#A3A9B1;--line:#2A2F35;--line-soft:#22262B;--accent:#3FB8A4;--on-accent:#06201C;--accent-ink:#3FB8A4;--sel-bg:#ECEEEF;--sel-ink:#15181C;--note-bg:#123530;--note-ink:#8EE0D2;--low-ink:#F5C77A}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font:inherit;cursor:pointer}
input::placeholder{color:var(--muted)}
.chip{height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:15px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-ink)}
.seg{flex:1;min-height:64px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:left;display:flex;flex-direction:column;gap:2px}
.seg[aria-pressed="true"]{border:2px solid var(--ink);padding:9px 11px}
.seg small{font-size:13px;color:var(--muted)}
.rbtn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.lbl{font-size:14px;font-weight:600;color:var(--muted)}
</style>
</helmet>
<div style="display: flex; gap: 40px; width: 820px; height: 844px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div class="{{t.cls}}" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; overflow: hidden; border-radius: 28px">

  <header style="padding: 20px 8px 8px 8px; display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" style="height: 44px; padding: 0 12px; display: flex; align-items: center; text-decoration: none; color: var(--ink); font-size: 16px">Cancel</a>
    <h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 18px; font-weight: 600">Edit product</h1>
    <div style="width: 72px"></div>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 8px 16px 130px; display: flex; flex-direction: column; gap: 22px">

    <div style="font-size: 14px; color: var(--muted)">{{stockLine}}</div>

    <label style="display: flex; flex-direction: column; gap: 8px">
      <span class="lbl">Name</span>
      <input type="text" value="{{name}}" onChange="{{onName}}" autocomplete="off" style="height: 52px; padding: 0 14px; border-radius: 12px; border: 2px solid var(--ink); background: var(--surface); font: inherit; font-size: 17px; color: var(--ink); outline: 0">
    </label>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div class="lbl">What is it?</div>
      <div role="group" aria-label="Kind" style="display: flex; gap: 8px">
        <sc-for list="{{kinds}}" as="k" hint-placeholder-count="2">
          <button type="button" class="chip" aria-pressed="{{k.pressed}}" onClick="{{k.pick}}" style="flex: 1">{{k.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div class="lbl">Where does it live?</div>
      <div role="group" aria-label="Location" style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{locs}}" as="l" hint-placeholder-count="5">
          <button type="button" class="chip" aria-pressed="{{l.pressed}}" onClick="{{l.pick}}">{{l.label}}</button>
        </sc-for>
      </div>
      <sc-if value="{{moving}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 10px; background: var(--note-bg); color: var(--note-ink); font-size: 14px; font-weight: 500">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
          {{moveText}}
        </div>
      </sc-if>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div class="lbl">How do you track it?</div>
      <div style="display: flex; gap: 8px">
        <button type="button" class="seg" aria-pressed="{{countedPressed}}" onClick="{{pickCounted}}">
          <span style="font-size: 15px; font-weight: 600">Count it</span>
          <small>3 tins, 485 g, 1 spare</small>
        </button>
        <button type="button" class="seg" aria-pressed="{{statusPressed}}" onClick="{{pickStatus}}">
          <span style="font-size: 15px; font-weight: 600">Have / Low / Out</span>
          <small>Spices, oil, dish soap</small>
        </button>
      </div>
      <sc-if value="{{toStatus}}" hint-placeholder-val="{{false}}">
        <div style="padding: 10px 12px; border-radius: 10px; background: var(--note-bg); color: var(--note-ink); font-size: 14px; font-weight: 500">{{toStatusText}}</div>
      </sc-if>
    </div>

    <sc-if value="{{isCounted}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <div class="lbl">Unit</div>
        <div role="group" aria-label="Unit" style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{units}}" as="u" hint-placeholder-count="7">
            <button type="button" class="chip" aria-pressed="{{u.pressed}}" onClick="{{u.pick}}">{{u.label}}</button>
          </sc-for>
        </div>
        <sc-if value="{{needsAmount}}" hint-placeholder-val="{{false}}">
          <label style="display: flex; flex-direction: column; gap: 8px">
            <span style="font-size: 14px; font-weight: 600; color: var(--low-ink)">{{amountPrompt}}</span>
            <span style="height: 52px; box-sizing: border-box; border-radius: 12px; background: var(--surface); border: 2px solid var(--ink); display: flex; align-items: center; gap: 8px; padding: 0 14px">
              <input type="text" inputmode="decimal" value="{{amount}}" onChange="{{onAmount}}" placeholder="0" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink)">
              <span style="font-size: 17px; color: var(--muted)">{{unitSuffix}}</span>
            </span>
          </label>
        </sc-if>

        <sc-if value="{{showSteps}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <div class="lbl">− / + buttons move by</div>
            <div role="group" aria-label="Step size" style="display: flex; flex-wrap: wrap; gap: 8px">
              <sc-for list="{{steps}}" as="sp" hint-placeholder-count="4">
                <button type="button" class="chip" aria-pressed="{{sp.pressed}}" onClick="{{sp.pick}}" style="height: 40px; font-size: 14px">{{sp.label}}</button>
              </sc-for>
            </div>
          </div>
        </sc-if>

        <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px">
          <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px; font-weight: 500">Add to shopping list below</span>
            <span style="font-size: 13px; color: var(--muted)">Optional</span>
          </div>
          <button type="button" class="rbtn" onClick="{{minDec}}" aria-label="Lower threshold">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
          </button>
          <div style="min-width: 56px; text-align: center; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">{{minText}}</div>
          <button type="button" class="rbtn" onClick="{{minInc}}" aria-label="Raise threshold">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          </button>
        </div>
      </div>
    </sc-if>

    <div style="display: flex; flex-direction: column; gap: 6px; padding-top: 18px; border-top: 1px solid var(--line-soft)">
      <a href="Main.dc.html" style="height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-size: 15px; font-weight: 600">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="1"></rect><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9"></path><path d="M10 13h4"></path></svg>
        Remove from Onhand
      </a>
      <div style="font-size: 13px; color: var(--muted); text-align: center">Archived, not deleted. You can undo right after.</div>
    </div>
  </main>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 28px; background: var(--bg); border-top: 1px solid var(--line)">
    <sc-if value="{{changed}}" hint-placeholder-val="{{true}}">
      <a href="Main.dc.html" style="height: 54px; border-radius: 14px; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 17px; font-weight: 600">{{saveLabel}}</a>
    </sc-if>
    <sc-if value="{{unchanged}}" hint-placeholder-val="{{false}}">
      <div aria-disabled="true" style="height: 54px; box-sizing: border-box; border-radius: 14px; border: 1px solid var(--line); color: var(--muted); display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600">No changes</div>
    </sc-if>
  </div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":820,"height":844}}'>
var ORIG = { name: 'Deordorant', kind: 'FOOD', loc: 'Pantry', mode: 'C', qty: 1, unit: 'piece', step: 1, min: 0 };
var UNITS = ['piece', 'g', 'kg', 'ml', 'l', 'pack', 'tin'];
var STEP = { piece: 1, g: 100, kg: 0.5, ml: 250, l: 0.5, pack: 1, tin: 1 };
var STEPS = { g: [50, 100, 250, 500], kg: [0.1, 0.25, 0.5, 1], ml: [100, 250, 500], l: [0.25, 0.5, 1] };
var LOCS = ['Pantry', 'Fridge', 'Freezer', 'Under the sink', 'Bathroom'];
var KINDS = [['FOOD', 'Food'], ['HOUSEHOLD', 'Household']];

function num(x) { return Number.isInteger(x) ? String(x) : (Math.round(x * 100) / 100).toString(); }
function unitWord(u, n) {
  if (u === 'piece') return '';
  if (u === 'tin' || u === 'pack') return ' ' + u + (n === 1 ? '' : 's');
  return ' ' + u;
}
function fmtQ(u, n) { return num(n) + unitWord(u, n); }

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { name: 'Deodorant', kind: 'HOUSEHOLD', loc: 'Bathroom', mode: 'C', unit: 'piece', step: 1, min: 1, amount: '' };
  }
  renderVals() {
    var self = this;
    var st = this.state;
    var press = function (b) { return b ? 'true' : 'false'; };
    var set = function (o) { return function () { self.setState(o); }; };
    var moving = st.loc !== ORIG.loc;
    var toStatus = ORIG.mode === 'C' && st.mode === 'S';
    var unitChanged = st.mode === 'C' && st.unit !== ORIG.unit;
    var fromStatus = ORIG.mode === 'S' && st.mode === 'C';
    var needsAmount = unitChanged || fromStatus;
    var changed = st.name !== ORIG.name || st.kind !== ORIG.kind || moving || st.mode !== ORIG.mode ||
      (st.mode === 'C' && (st.unit !== ORIG.unit || st.min !== ORIG.min || st.step !== ORIG.step));
    var opts = STEPS[st.unit] || [];
    return {
      themes: [{ cls: 't-light' }, { cls: 't-dark' }],
      stockLine: 'Was “' + ORIG.name + '” · ' + fmtQ(ORIG.unit, ORIG.qty) + ' in ' + ORIG.loc,
      name: st.name,
      onName: function (e) { self.setState({ name: e.target.value }); },
      kinds: KINDS.map(function (k) { return { label: k[1], pressed: press(st.kind === k[0]), pick: set({ kind: k[0] }) }; }),
      locs: LOCS.map(function (l) { return { label: l, pressed: press(st.loc === l), pick: set({ loc: l }) }; }),
      moving: moving,
      moveText: 'Moves ' + fmtQ(ORIG.unit, ORIG.qty) + ' from ' + ORIG.loc + ' to ' + st.loc,
      countedPressed: press(st.mode === 'C'),
      statusPressed: press(st.mode === 'S'),
      pickCounted: set({ mode: 'C' }),
      pickStatus: set({ mode: 'S' }),
      toStatus: toStatus,
      toStatusText: 'Will be set to ' + (ORIG.qty > 0 ? 'Have' : 'Out') + ' (you have ' + fmtQ(ORIG.unit, ORIG.qty) + ')',
      isCounted: st.mode === 'C',
      units: UNITS.map(function (u) {
        return { label: u, pressed: press(st.unit === u), pick: function () { self.setState({ unit: u, step: STEP[u], min: 0, amount: '' }); } };
      }),
      needsAmount: needsAmount,
      amountPrompt: fromStatus ? 'How much do you have now?' : 'Unit changed — how much do you have now?',
      amount: st.amount,
      onAmount: function (e) { var t = e.target.value; if (/^\d*[.,]?\d*$/.test(t)) self.setState({ amount: t }); },
      unitSuffix: st.unit === 'piece' ? 'pcs' : unitWord(st.unit, 2).trim(),
      showSteps: opts.length > 0,
      steps: opts.map(function (s) { return { label: fmtQ(st.unit, s), pressed: press(st.step === s), pick: set({ step: s }) }; }),
      minText: st.min === 0 ? 'Off' : fmtQ(st.unit, st.min),
      minInc: function () { self.setState({ min: st.min + STEP[st.unit] }); },
      minDec: function () { self.setState({ min: Math.max(0, st.min - STEP[st.unit]) }); },
      changed: changed,
      unchanged: !changed,
      saveLabel: moving ? 'Save and move' : 'Save changes'
    };
  }
}
</script>
</body>
</html>
