<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onhand — Add product</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E6B5E}a:hover{color:#0B5148}
.t-light{--bg:#F5F6F4;--surface:#FFFFFF;--ink:#15181C;--muted:#5B616B;--line:#E4E6E3;--line-soft:#EEF0ED;--accent:#0E6B5E;--on-accent:#FFFFFF;--accent-ink:#0E6B5E;--sel-bg:#15181C;--sel-ink:#FFFFFF}
.t-dark{--bg:#0F1113;--surface:#181B1F;--ink:#ECEEEF;--muted:#A3A9B1;--line:#2A2F35;--line-soft:#22262B;--accent:#3FB8A4;--on-accent:#06201C;--accent-ink:#3FB8A4;--sel-bg:#ECEEEF;--sel-ink:#15181C}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font:inherit;cursor:pointer}
input::placeholder{color:var(--muted)}
.chip{height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:15px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-ink)}
.seg{flex:1;min-height:64px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:left;display:flex;flex-direction:column;gap:2px}
.seg[aria-pressed="true"]{border:2px solid var(--ink);padding:9px 11px}
.seg small{font-size:13px;color:var(--muted)}
.rbtn{width:52px;height:52px;border-radius:26px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.rbtn.sm{width:44px;height:44px;border-radius:22px}
.lbl{font-size:14px;font-weight:600;color:var(--muted)}
</style>
</helmet>
<div style="display: flex; gap: 40px; width: 820px; height: 844px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div class="{{t.cls}}" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; overflow: hidden; border-radius: 28px">

  <header style="padding: 20px 8px 8px 8px; display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" style="height: 44px; padding: 0 12px; display: flex; align-items: center; text-decoration: none; color: var(--ink); font-size: 16px">Cancel</a>
    <h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 18px; font-weight: 600">Add product</h1>
    <div style="width: 72px"></div>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 8px 16px 120px; display: flex; flex-direction: column; gap: 22px">

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label style="display: flex; flex-direction: column; gap: 8px">
        <span class="lbl">Name</span>
        <input type="text" value="{{name}}" onChange="{{onName}}" placeholder="e.g. Basmati rice, Dish soap" autocomplete="off" style="height: 52px; padding: 0 14px; border-radius: 12px; border: 2px solid var(--ink); background: var(--surface); font: inherit; font-size: 17px; color: var(--ink); outline: 0">
      </label>
      <sc-if value="{{showSuggest}}" hint-placeholder-val="{{true}}">
        <div style="background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden">
          <sc-for list="{{matches}}" as="m" hint-placeholder-count="1">
            <a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 14px; text-decoration: none; color: var(--ink); border-bottom: 1px solid var(--line-soft)">
              <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 16px; font-weight: 500">{{m.name}}</span>
                <span style="font-size: 13px; color: var(--muted)">Already tracked · {{m.where}}</span>
              </div>
              <span style="font-size: 14px; font-weight: 600; color: var(--accent-ink)">Restock</span>
            </a>
          </sc-for>
          <div style="display: flex; align-items: center; min-height: 52px; padding: 8px 14px; font-size: 15px; color: var(--muted)">New product: “{{name}}”</div>
        </div>
      </sc-if>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div class="lbl">What is it?</div>
      <div role="group" aria-label="Kind" style="display: flex; gap: 8px">
        <sc-for list="{{kinds}}" as="k" hint-placeholder-count="2">
          <button type="button" class="chip" aria-pressed="{{k.pressed}}" onClick="{{k.pick}}" style="flex: 1">{{k.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div class="lbl">How do you track it?</div>
      <div style="display: flex; gap: 8px">
        <button type="button" class="seg" aria-pressed="{{countedPressed}}" onClick="{{pickCounted}}">
          <span style="font-size: 15px; font-weight: 600">Count it</span>
          <small>3 tins, 485 g, 1 spare</small>
        </button>
        <button type="button" class="seg" aria-pressed="{{statusPressed}}" onClick="{{pickStatus}}">
          <span style="font-size: 15px; font-weight: 600">Have / Low / Out</span>
          <small>Spices, oil, dish soap</small>
        </button>
      </div>
    </div>

    <sc-if value="{{isCounted}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <div class="lbl">How much?</div>
        <div style="display: flex; align-items: center; gap: 12px">
          <button type="button" class="rbtn" onClick="{{dec}}" aria-label="Less">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
          </button>
          <label style="flex: 1; height: 52px; box-sizing: border-box; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 12px">
            <span class="sr-only">Quantity</span>
            <input type="text" inputmode="decimal" value="{{qtyValue}}" onChange="{{onQty}}" style="width: 80px; border: 0; outline: 0; background: transparent; text-align: right; font: inherit; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink)">
            <span style="font-size: 17px; color: var(--muted)">{{unitSuffix}}</span>
          </label>
          <button type="button" class="rbtn" onClick="{{inc}}" aria-label="More">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          </button>
        </div>
        <div role="group" aria-label="Unit" style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{units}}" as="u" hint-placeholder-count="7">
            <button type="button" class="chip" aria-pressed="{{u.pressed}}" onClick="{{u.pick}}">{{u.label}}</button>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isStatus}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div class="lbl">Right now you…</div>
        <div role="group" aria-label="Status" style="display: flex; gap: 8px">
          <sc-for list="{{statuses}}" as="s" hint-placeholder-count="3">
            <button type="button" class="chip" aria-pressed="{{s.pressed}}" onClick="{{s.pick}}" style="flex: 1">{{s.label}}</button>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div class="lbl">Where does it live?</div>
      <div role="group" aria-label="Location" style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{locs}}" as="l" hint-placeholder-count="5">
          <button type="button" class="chip" aria-pressed="{{l.pressed}}" onClick="{{l.pick}}">{{l.label}}</button>
        </sc-for>
      </div>
    </div>

    <sc-if value="{{isCounted}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 500">Add to shopping list below</span>
          <span style="font-size: 13px; color: var(--muted)">Optional</span>
        </div>
        <button type="button" class="rbtn sm" onClick="{{minDec}}" aria-label="Lower threshold">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
        </button>
        <div style="min-width: 56px; text-align: center; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">{{minText}}</div>
        <button type="button" class="rbtn sm" onClick="{{minInc}}" aria-label="Raise threshold">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        </button>
      </div>
    </sc-if>
  </main>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 28px; background: var(--bg); border-top: 1px solid var(--line)">
    <a href="Main.dc.html" style="height: 54px; border-radius: 14px; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 17px; font-weight: 600">{{saveLabel}}</a>
  </div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":820,"height":844}}'>
var EXISTING = [
  { name: 'Chicken breast', where: 'Freezer · 485 g' },
  { name: 'Chickpeas', where: 'Pantry · 3 tins' },
  { name: 'Chicken thighs', where: 'Freezer · 2 packs' },
  { name: 'Dish soap', where: 'Under the sink · Low' },
  { name: 'Floor cleaner (spare)', where: 'Under the sink · 1' },
  { name: 'Basmati rice', where: 'Pantry · 1.5 kg' }
];
var UNITS = ['piece', 'g', 'kg', 'ml', 'l', 'pack', 'tin'];
var STEP = { piece: 1, g: 100, kg: 0.5, ml: 250, l: 0.5, pack: 1, tin: 1 };
var LOCS = ['Pantry', 'Fridge', 'Freezer', 'Under the sink', 'Bathroom'];
var STATUSES = [['HAVE', 'Have it'], ['LOW', 'Low'], ['OUT', 'Out']];
var KINDS = [['FOOD', 'Food'], ['HOUSEHOLD', 'Household']];

function num(x) { return Number.isInteger(x) ? String(x) : (Math.round(x * 100) / 100).toString(); }
function unitWord(u, n) {
  if (u === 'piece') return '';
  if (u === 'tin' || u === 'pack') return ' ' + u + (n === 1 ? '' : 's');
  return ' ' + u;
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { name: 'Chick', kind: 'FOOD', mode: 'C', qty: 485, qtyText: null, unit: 'g', loc: 'Freezer', status: 'HAVE', min: 200 };
  }
  renderVals() {
    var self = this;
    var st = this.state;
    var q = st.name.trim().toLowerCase();
    var matches = q.length < 2 ? [] : EXISTING.filter(function (e) { return e.name.toLowerCase().indexOf(q) === 0; }).slice(0, 3);
    var qn = Math.round(st.qty * 100) / 100;
    var press = function (b) { return b ? 'true' : 'false'; };
    return {
      themes: [{ cls: 't-light' }, { cls: 't-dark' }],
      name: st.name,
      onName: function (e) { self.setState({ name: e.target.value }); },
      showSuggest: q.length >= 2,
      matches: matches,
      kinds: KINDS.map(function (k) {
        return { label: k[1], pressed: press(st.kind === k[0]), pick: function () { self.setState({ kind: k[0] }); } };
      }),
      isCounted: st.mode === 'C',
      isStatus: st.mode === 'S',
      countedPressed: press(st.mode === 'C'),
      statusPressed: press(st.mode === 'S'),
      pickCounted: function () { self.setState({ mode: 'C' }); },
      pickStatus: function () { self.setState({ mode: 'S' }); },
      qtyValue: st.qtyText != null ? st.qtyText : num(qn),
      unitSuffix: st.unit === 'piece' ? 'pcs' : unitWord(st.unit, qn).trim(),
      onQty: function (e) {
        var t = e.target.value;
        if (!/^\d*[.,]?\d*$/.test(t)) return;
        self.setState({ qtyText: t, qty: parseFloat(t.replace(',', '.')) || 0 });
      },
      inc: function () { self.setState({ qty: st.qty + STEP[st.unit], qtyText: null }); },
      dec: function () { self.setState({ qty: Math.max(0, st.qty - STEP[st.unit]), qtyText: null }); },
      units: UNITS.map(function (u) {
        return { label: u, pressed: press(st.unit === u), pick: function () { self.setState({ unit: u, qty: STEP[u], qtyText: null, min: 0 }); } };
      }),
      statuses: STATUSES.map(function (s) {
        return { label: s[1], pressed: press(st.status === s[0]), pick: function () { self.setState({ status: s[0] }); } };
      }),
      locs: LOCS.map(function (l) {
        return { label: l, pressed: press(st.loc === l), pick: function () { self.setState({ loc: l }); } };
      }),
      minText: st.min === 0 ? 'Off' : num(st.min) + unitWord(st.unit, st.min),
      minInc: function () { self.setState({ min: st.min + STEP[st.unit] }); },
      minDec: function () { self.setState({ min: Math.max(0, st.min - STEP[st.unit]) }); },
      saveLabel: 'Add to ' + st.loc
    };
  }
}
</script>
</body>
</html>
